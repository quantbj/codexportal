<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gebuchte Verträge | Direktvermarktung Sales Portal</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="offer-page">
  <header class="hero hero-compact">
    <div class="hero-content">
      <p class="kicker">Direktvermarktung Strom</p>
      <h1>Gebuchte Verträge</h1>
      <p>Übersicht Ihrer gespeicherten Entwürfe und gebuchten Verträge.</p>
      <nav class="top-nav" aria-label="Seitennavigation">
        <a class="nav-link" href="./index.html">Pricing</a>
        <a class="nav-link" href="./offer.html">Vertrag buchen</a>
        <a class="nav-link active" href="./my-requests.html">Gebuchte Verträge</a>
        <a class="nav-link admin-nav-link nav-hidden" href="./admin.html">Admin</a>
        <a class="nav-link" href="./agb.html">AGB</a>
        <a class="nav-link" href="./impressum.html">Impressum</a>
      </nav>
    </div>
  </header>

  <main class="layout">
    <section class="panel form-card">
      <h2>Anmeldung</h2>
      <form id="authForm" class="form-grid">
        <label>
          Benutzername
          <input name="username" type="text" placeholder="customer1" required>
        </label>
        <label>
          Passwort
          <input name="password" type="password" placeholder="customer1" required>
        </label>
        <div class="form-actions">
          <button type="submit">Anmelden</button>
          <button id="loadDraftsButton" type="button">Verträge laden</button>
          <button id="logoutButton" type="button">Abmelden</button>
        </div>
      </form>
      <p id="authStatus" class="contract-status">Nicht angemeldet.</p>
    </section>

    <section class="panel form-card">
      <h2>Draft</h2>
      <div id="draftsList" class="drafts-list"></div>
      <h2 class="contracts-subsection">Booked</h2>
      <div id="bookedList" class="drafts-list"></div>
    </section>
  </main>

  <div id="contractPreviewModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="contractPreviewTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="contractPreviewTitle">Vertragsvorschau</h2>
        <button id="closeContractPreviewButton" type="button" class="danger-button">Schließen</button>
      </div>
      <p id="contractPreviewMeta" class="contract-status"></p>
      <pre id="contractPreviewContent" class="contract-preview">{}</pre>
    </div>
  </div>

  <script type="module">
    import { syncAdminNavVisibility } from "./auth-nav.js";
    syncAdminNavVisibility();
  </script>
  <script type="module" src="./my-requests.js"></script>
</body>
</html>
